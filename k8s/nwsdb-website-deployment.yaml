apiVersion: apps/v1
kind: Deployment
metadata:
  name: nwsdb-website-deployment
  labels:
    app: nwsdb-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nwsdb-website
  template:
    metadata:
      labels:
        app: nwsdb-website
    spec:
      containers:
      - name: nwsdb-website
        image: nwsdb-customer-website:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: NwsdbApiUrl
          value: "http://nwsdb-api:8080/"
---
apiVersion: v1
kind: Service
metadata:
  name: nwsdb-website
spec:
  type: LoadBalancer
  ports:
  - port: 5003
    targetPort: 8080
  selector:
    app: nwsdb-website
